<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Organization prediction distribution: zero-shot vs QLoRA v1</title>
  <desc id="desc">Zero-shot predicts score 5 for 304 of 399 valid samples, while QLoRA v1 shifts predictions toward scores 3 and 4 on 400 validation samples.</desc>
  <rect width="900" height="470" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Organization prediction distribution</text>
  <text x="450" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Zero-shot over-scoring is reduced after QLoRA, with remaining compression toward middle scores</text>

  <line x1="90" y1="390" x2="810" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="390" stroke="#333" stroke-width="1.5"/>

  <line x1="90" y1="296.25" x2="810" y2="296.25" stroke="#ddd"/>
  <line x1="90" y1="202.5" x2="810" y2="202.5" stroke="#ddd"/>
  <line x1="90" y1="108.75" x2="810" y2="108.75" stroke="#ddd"/>
  <text x="78" y="395" text-anchor="end" font-family="Arial, sans-serif" font-size="12">0</text>
  <text x="78" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="12">100</text>
  <text x="78" y="207" text-anchor="end" font-family="Arial, sans-serif" font-size="12">200</text>
  <text x="78" y="113" text-anchor="end" font-family="Arial, sans-serif" font-size="12">300</text>
  <text x="28" y="240" transform="rotate(-90 28 240)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Prediction count</text>

  <!-- score 1 -->
  <rect x="135" y="390" width="34" height="0" fill="#4e79a7"/>
  <rect x="173" y="390" width="34" height="0" fill="#f28e2b"/>
  <!-- score 2 -->
  <rect x="255" y="390" width="34" height="0" fill="#4e79a7"/>
  <rect x="293" y="385.31" width="34" height="4.69" fill="#f28e2b"/>
  <text x="310" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">5</text>
  <!-- score 3 -->
  <rect x="375" y="379.69" width="34" height="10.31" fill="#4e79a7"/>
  <rect x="413" y="163.13" width="34" height="226.87" fill="#f28e2b"/>
  <text x="392" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">11</text>
  <text x="430" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">242</text>
  <!-- score 4 -->
  <rect x="495" y="311.25" width="34" height="78.75" fill="#4e79a7"/>
  <rect x="533" y="246.56" width="34" height="143.44" fill="#f28e2b"/>
  <text x="512" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">84</text>
  <text x="550" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">153</text>
  <!-- score 5 -->
  <rect x="615" y="105" width="34" height="285" fill="#4e79a7"/>
  <rect x="653" y="390" width="34" height="0" fill="#f28e2b"/>
  <text x="632" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">304</text>

  <text x="171" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">1</text>
  <text x="291" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">2</text>
  <text x="411" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">3</text>
  <text x="531" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">4</text>
  <text x="651" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">5</text>
  <text x="411" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Predicted score</text>

  <rect x="650" y="70" width="14" height="14" fill="#4e79a7"/>
  <text x="672" y="82" font-family="Arial, sans-serif" font-size="12">Zero-shot (n=399 valid)</text>
  <rect x="650" y="91" width="14" height="14" fill="#f28e2b"/>
  <text x="672" y="103" font-family="Arial, sans-serif" font-size="12">QLoRA v1 (n=400)</text>
</svg>
